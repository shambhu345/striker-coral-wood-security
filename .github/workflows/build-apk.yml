name: Build Striker Security APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unzip Android project
        run: |
          rm -rf android_project
          mkdir android_project
          unzip -q "Striker_Coral_Wood_Security_Mobile_Build_v3.zip" -d android_project
          test -f android_project/settings.gradle
          test -f android_project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android_project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Striker-Coral-Wood-Security-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
